service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Trong 28 ngày, số request có response_sent và latency_ms <= 3000
    phải đạt ít nhất 99.5% của request_received. Error budget là 0.5%
    tổng request, tức tối đa 50 request không đạt trên mỗi 10,000 request.
    Tính cả request_failed và request chậm là không đạt SLO.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
